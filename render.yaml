services:
- type: web
  name: minio-server
  healthCheckPath: /minio/health/live
  runtime: image
  image:
    # Temporary stabilization pin. Upgrade separately after testing persistent-disk ownership.
    url: docker.io/minio/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
  dockerCommand: minio server /data --address $HOST:$PORT --console-address $HOST:$CONSOLE_PORT
  autoDeploy: false
  disk:
    name: data
    mountPath: /data
  envVars:
  # Credentials are intentionally unmanaged so the existing service keeps its current values.
  - key: HOST
    value: "0.0.0.0"
  - key: PORT
    value: 9000
  - key: CONSOLE_PORT
    value: 9090
  

- type: web
  name: minio-console
  runtime: docker
  dockerContext: /
  dockerfilePath: ./Dockerfile
  healthCheckPath: /healthz
  autoDeploy: false
  envVars:
  - key: PORT
    value: 10000
  - key: MINIO_HOST
    fromService:
      name: minio-server
      type: web
      property: host
  - key: MINIO_CONSOLE_PORT
    fromService:
      name: minio-server
      type: web
      envVarKey: CONSOLE_PORT
